<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker Pro</title>
    <!-- Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      /* Variáveis CSS Globais Dinâmicas */
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --inner-bg: #0f172a;
        --text-main: #f8fafc;
        --text-secondary: #94a3b8;
        --primary-color: #3b82f6;
        --primary-hover: #2563eb;
        --success-color: #22c55e;
        --danger-color: #ef4444;
        --border-color: #334155;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 30px 15px;
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      .container {
        width: 100%;
        max-width: 850px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .card {
        background-color: var(--card-bg);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border-color);
        transition:
          background-color 0.3s,
          border-color 0.3s;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
      }

      header h1 {
        font-size: 26px;
        font-weight: 700;
        color: var(--text-main);
      }

      header p {
        margin-top: 4px;
        color: var(--text-secondary);
        font-size: 14px;
      }

      /* Painel de Personalização de Cores */
      .theme-panel {
        background-color: var(--inner-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 24px;
      }

      .theme-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--text-main);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .color-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
      }

      .color-picker-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .color-picker-item label {
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .color-picker-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: var(--card-bg);
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
      }

      .color-picker-wrapper input[type="color"] {
        -webkit-appearance: none;
        border: none;
        width: 28px;
        height: 28px;
        border-radius: 4px;
        cursor: pointer;
        background: none;
      }

      .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
        border: 1px solid var(--border-color);
        border-radius: 4px;
      }

      .color-val {
        font-size: 11px;
        color: var(--text-secondary);
        font-mono: monospace;
      }

      /* Sessão de Gráficos */
      .charts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
        margin-bottom: 24px;
      }

      .chart-card {
        background-color: var(--inner-bg);
        border-radius: 12px;
        padding: 16px;
        border: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .chart-card h3 {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-main);
      }

      .chart-container {
        position: relative;
        height: 200px;
        width: 100%;
      }

      /* Form e Lista */
      form {
        display: flex;
        gap: 10px;
        margin-bottom: 24px;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background-color: var(--inner-bg);
        color: var(--text-main);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      input[type="text"]:focus {
        border-color: var(--primary-color);
      }

      button.btn-add {
        padding: 12px 20px;
        border-radius: 8px;
        border: none;
        background-color: var(--primary-color);
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.2s;
      }

      button.btn-add:hover {
        background-color: var(--primary-hover);
      }

      .habit-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .empty-text {
        text-align: center;
        color: var(--text-secondary);
        font-size: 14px;
        padding: 20px 0;
      }

      .habit-card {
        background-color: var(--inner-bg);
        border-radius: 12px;
        padding: 16px;
        border: 1px solid var(--border-color);
      }

      .habit-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .habit-name {
        font-weight: 600;
        font-size: 15px;
        color: var(--text-main);
      }

      .btn-delete {
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 16px;
        padding: 4px;
        transition: color 0.2s;
      }

      .btn-delete:hover {
        color: var(--danger-color);
      }

      .days-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }

      .day-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 8px 0;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background-color: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.2s;
      }

      .day-btn.active {
        background-color: var(--success-color);
        border-color: var(--success-color);
        color: #ffffff;
      }

      .day-label {
        font-size: 11px;
        font-weight: 500;
        margin-bottom: 2px;
      }

      .day-status {
        height: 14px;
        font-size: 12px;
        font-weight: bold;
      }

      .reset-theme-btn {
        background: none;
        border: none;
        color: var(--primary-color);
        font-size: 12px;
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <header>
          <div>
            <h1>Habit Tracker Pro</h1>
            <p>Acompanhe sua consistência com gráficos e tema personalizado</p>
          </div>
        </header>

        <!-- Painel de Customização de Cores -->
        <div class="theme-panel">
          <div class="theme-title">
            <span
              >🎨 Personalizar Cores da Interface (Clique nas Cores e
              Altere)</span
            >
            <button class="reset-theme-btn" onclick="resetTheme()">
              Restaurar Padrão
            </button>
          </div>
          <div class="color-grid">
            <div class="color-picker-item">
              <label>Fundo da Página</label>
              <div class="color-picker-wrapper">
                <input
                  type="color"
                  id="bg-color-picker"
                  onchange="updateTheme('bg-color', this.value)"
                />
                <span class="color-val" id="bg-color-val">#0f172a</span>
              </div>
            </div>
            <div class="color-picker-item">
              <label>Fundo dos Cards</label>
              <div class="color-picker-wrapper">
                <input
                  type="color"
                  id="card-bg-picker"
                  onchange="updateTheme('card-bg', this.value)"
                />
                <span class="color-val" id="card-bg-val">#1e293b</span>
              </div>
            </div>
            <div class="color-picker-item">
              <label>Fundo Interno</label>
              <div class="color-picker-wrapper">
                <input
                  type="color"
                  id="inner-bg-picker"
                  onchange="updateTheme('inner-bg', this.value)"
                />
                <span class="color-val" id="inner-bg-val">#0f172a</span>
              </div>
            </div>
            <div class="color-picker-item">
              <label>Cor Principal</label>
              <div class="color-picker-wrapper">
                <input
                  type="color"
                  id="primary-color-picker"
                  onchange="updateTheme('primary-color', this.value)"
                />
                <span class="color-val" id="primary-color-val">#3b82f6</span>
              </div>
            </div>
            <div class="color-picker-item">
              <label>Concluído (Sucesso)</label>
              <div class="color-picker-wrapper">
                <input
                  type="color"
                  id="success-color-picker"
                  onchange="updateTheme('success-color', this.value)"
                />
                <span class="color-val" id="success-color-val">#22c55e</span>
              </div>
            </div>
            <div class="color-picker-item">
              <label>Texto Principal</label>
              <div class="color-picker-wrapper">
                <input
                  type="color"
                  id="text-main-picker"
                  onchange="updateTheme('text-main', this.value)"
                />
                <span class="color-val" id="text-main-val">#f8fafc</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Seção de Gráficos -->
        <div class="charts-grid">
          <div class="chart-card">
            <h3>📊 Conclusão Individual por Hábito</h3>
            <div class="chart-container">
              <canvas id="habitChart"></canvas>
            </div>
          </div>
          <div class="chart-card">
            <h3>📅 Progresso Geral por Dia da Semana</h3>
            <div class="chart-container">
              <canvas id="weeklyChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Formulário de Adição -->
        <form id="habit-form">
          <input
            type="text"
            id="habit-input"
            placeholder="Novo hábito (ex: Treinar pernas, Meditar)"
            required
          />
          <button type="submit" class="btn-add">Adicionar Hábito</button>
        </form>

        <!-- Lista de Hábitos -->
        <div class="habit-list" id="habit-list"></div>
      </div>
    </div>

    <script>
      const DAYS = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];

      const defaultTheme = {
        "bg-color": "#0f172a",
        "card-bg": "#1e293b",
        "inner-bg": "#0f172a",
        "text-main": "#f8fafc",
        "text-secondary": "#94a3b8",
        "primary-color": "#3b82f6",
        "primary-hover": "#2563eb",
        "success-color": "#22c55e",
        "danger-color": "#ef4444",
        "border-color": "#334155",
      };

      let theme = JSON.parse(localStorage.getItem("habit_theme")) || {
        ...defaultTheme,
      };

      let habits = JSON.parse(localStorage.getItem("habits_v2_data")) || [
        { id: 1, name: "Ler 15 páginas", completedDays: [0, 1, 2, 4] },
        { id: 2, name: "Beber 2L de água", completedDays: [0, 1, 2, 3, 4, 5] },
        { id: 3, name: "Exercício Físico", completedDays: [1, 3, 5] },
      ];

      let habitChartInstance = null;
      let weeklyChartInstance = null;

      // Inicialização e Aplicação do Tema
      function applyTheme() {
        Object.keys(theme).forEach((key) => {
          document.documentElement.style.setProperty(`--${key}`, theme[key]);
          const picker = document.getElementById(`${key}-picker`);
          const label = document.getElementById(`${key}-val`);
          if (picker) picker.value = theme[key];
          if (label) label.textContent = theme[key];
        });

        if (theme["primary-color"]) {
          theme["primary-hover"] = adjustColor(theme["primary-color"], -20);
          document.documentElement.style.setProperty(
            "--primary-hover",
            theme["primary-hover"],
          );
        }

        updateCharts();
      }

      function updateTheme(key, value) {
        theme[key] = value;
        localStorage.setItem("habit_theme", JSON.stringify(theme));
        applyTheme();
      }

      function resetTheme() {
        theme = { ...defaultTheme };
        localStorage.setItem("habit_theme", JSON.stringify(theme));
        applyTheme();
      }

      function adjustColor(col, amt) {
        let num = parseInt(col.replace("#", ""), 16);
        let r = (num >> 16) + amt;
        let b = ((num >> 8) & 0x00ff) + amt;
        let g = (num & 0x0000ff) + amt;
        return (
          "#" +
          (
            0x1000000 +
            (r < 255 ? (r < 0 ? 0 : r) : 255) * 0x10000 +
            (b < 255 ? (b < 0 ? 0 : b) : 255) * 0x100 +
            (g < 255 ? (g < 0 ? 0 : g) : 255)
          )
            .toString(16)
            .slice(1)
        );
      }

      // CRUD e Operações
      function saveAndRender() {
        localStorage.setItem("habits_v2_data", JSON.stringify(habits));
        renderList();
        updateCharts();
      }

      function toggleDay(habitId, dayIndex) {
        habits = habits.map((h) => {
          if (h.id === habitId) {
            const isDone = h.completedDays.includes(dayIndex);
            const updated = isDone
              ? h.completedDays.filter((d) => d !== dayIndex)
              : [...h.completedDays, dayIndex];
            return { ...h, completedDays: updated };
          }
          return h;
        });
        saveAndRender();
      }

      function deleteHabit(habitId) {
        habits = habits.filter((h) => h.id !== habitId);
        saveAndRender();
      }

      document.getElementById("habit-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("habit-input");
        const text = input.value.trim();
        if (!text) return;

        habits.push({ id: Date.now(), name: text, completedDays: [] });
        input.value = "";
        saveAndRender();
      });

      // Renderizar Lista
      function renderList() {
        const habitList = document.getElementById("habit-list");
        habitList.innerHTML = "";

        if (habits.length === 0) {
          habitList.innerHTML = `<p class="empty-text">Nenhum hábito cadastrado. Adicione um acima!</p>`;
          return;
        }

        habits.forEach((habit) => {
          const card = document.createElement("div");
          card.className = "habit-card";

          const header = document.createElement("div");
          header.className = "habit-header";
          header.innerHTML = `
          <span class="habit-name">${habit.name}</span>
          <button class="btn-delete" onclick="deleteHabit(${habit.id})" title="Excluir">✕</button>
        `;

          const daysGrid = document.createElement("div");
          daysGrid.className = "days-grid";

          DAYS.forEach((day, idx) => {
            const isDone = habit.completedDays.includes(idx);
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = `day-btn ${isDone ? "active" : ""}`;
            btn.onclick = () => toggleDay(habit.id, idx);
            btn.innerHTML = `
            <span class="day-label">${day}</span>
            <span class="day-status">${isDone ? "✓" : ""}</span>
          `;
            daysGrid.appendChild(btn);
          });

          card.appendChild(header);
          card.appendChild(daysGrid);
          habitList.appendChild(card);
        });
      }

      // Chart.js - Renderização dos Gráficos
      function initCharts() {
        const ctxHabit = document.getElementById("habitChart").getContext("2d");
        const ctxWeekly = document
          .getElementById("weeklyChart")
          .getContext("2d");

        habitChartInstance = new Chart(ctxHabit, {
          type: "bar",
          data: {
            labels: [],
            datasets: [{ label: "% Concluído", data: [], backgroundColor: [] }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: {
                min: 0,
                max: 100,
                ticks: {
                  color: theme["text-secondary"],
                  callback: (v) => v + "%",
                },
                grid: { color: theme["border-color"] },
              },
              x: {
                ticks: { color: theme["text-secondary"] },
                grid: { display: false },
              },
            },
          },
        });

        weeklyChartInstance = new Chart(ctxWeekly, {
          type: "line",
          data: {
            labels: DAYS,
            datasets: [
              {
                label: "Total Concluído",
                data: [],
                borderColor: [],
                backgroundColor: [],
                tension: 0.3,
                fill: true,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: {
                beginAtZero: true,
                ticks: { color: theme["text-secondary"], stepSize: 1 },
                grid: { color: theme["border-color"] },
              },
              x: {
                ticks: { color: theme["text-secondary"] },
                grid: { display: false },
              },
            },
          },
        });

        updateCharts();
      }

      function updateCharts() {
        if (!habitChartInstance || !weeklyChartInstance) return;

        // 1. Atualiza Gráfico por Hábito
        const habitNames = habits.map((h) => h.name);
        const habitPercentages = habits.map((h) =>
          Math.round((h.completedDays.length / 7) * 100),
        );

        habitChartInstance.data.labels = habitNames;
        habitChartInstance.data.datasets[0].data = habitPercentages;
        habitChartInstance.data.datasets[0].backgroundColor =
          theme["primary-color"];
        habitChartInstance.options.scales.y.ticks.color =
          theme["text-secondary"];
        habitChartInstance.options.scales.x.ticks.color =
          theme["text-secondary"];
        habitChartInstance.options.scales.y.grid.color = theme["border-color"];
        habitChartInstance.update();

        // 2. Atualiza Gráfico Geral Por Dia da Semana
        const dayTotals = DAYS.map((_, dayIdx) => {
          return habits.reduce(
            (acc, h) => acc + (h.completedDays.includes(dayIdx) ? 1 : 0),
            0,
          );
        });

        weeklyChartInstance.data.datasets[0].data = dayTotals;
        weeklyChartInstance.data.datasets[0].borderColor =
          theme["success-color"];
        weeklyChartInstance.data.datasets[0].backgroundColor =
          theme["success-color"] + "33";
        weeklyChartInstance.options.scales.y.ticks.color =
          theme["text-secondary"];
        weeklyChartInstance.options.scales.x.ticks.color =
          theme["text-secondary"];
        weeklyChartInstance.options.scales.y.grid.color = theme["border-color"];
        weeklyChartInstance.update();
      }

      // Execução Inicial
      applyTheme();
      renderList();
      initCharts();
    </script>
  </body>
</html>
